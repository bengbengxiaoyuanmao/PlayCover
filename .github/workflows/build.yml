name: Build PlayCover (Unsigned)

on:
  push:
    branches: [ "main", "develop", "MaaTools" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Xcode
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: 安装 Carthage 依赖
      run: |
        brew install carthage
        rm -rf ~/Library/Caches/org.carthage.CarthageKit
        carthage bootstrap --no-use-binaries --platform macOS

    - name: 修复项目配置（跳过指定脚本）
      run: |
        # 使用 Python 精准修改 project.pbxproj
        python3 - <<EOF
        import sys

        file_path = 'PlayCover.xcodeproj/project.pbxproj'
        with open(file_path, 'r') as f:
            content = f.read()

        # 需要跳过的脚本ID（对应 Codesign sparkle 和 Carthage Bootstrap）
        target_script_ids = [
            'AAC28F222899A05B005057FB',  # Codesign sparkle
            'AAE8809C287ACA4900FBB23C'   # Carthage Bootstrap
        ]

        lines = content.split('\\n')
        modified_lines = []
        i = 0
        while i < len(lines):
            line = lines[i]
            modified_lines.append(line)
            # 检查当前行是否包含目标脚本ID
            for script_id in target_script_ids:
                if script_id in line:
                    # 找到对应的字典块，需要向后查找 '};' 闭合
                    j = i
                    brace_count = 0
                    # 计算当前行的开始大括号
                    brace_count += line.count('{') - line.count('}')
                    # 向后搜索直到括号闭合
                    while brace_count > 0 and j + 1 < len(lines):
                        j += 1
                        brace_count += lines[j].count('{') - lines[j].count('}')
                    # 在字典块内查找并修改 runOnlyForDeploymentPostprocessing
                    for k in range(i, j + 1):
                        if 'runOnlyForDeploymentPostprocessing' in lines[k]:
                            # 修改值为 1，确保格式一致
                            lines[k] = lines[k].replace('0', '1')
                            break
                    else:
                        # 如果没有该属性，在字典块的第一个属性后插入一行
                        # 简单起见，在 '};' 前插入
                        indent = ' ' * 8
                        insertion_line = f'{indent}runOnlyForDeploymentPostprocessing = 1;'
                        # 找到闭合大括号的位置
                        close_idx = j
                        # 找到 '};' 所在行
                        while close_idx > i and '};' not in lines[close_idx]:
                            close_idx -= 1
                        if close_idx > i:
                            lines.insert(close_idx, insertion_line)
                            j += 1  # 因为插入了一行，后面的索引需要调整，但不影响外层循环
            i += 1

        with open(file_path, 'w') as f:
            f.write('\\n'.join(lines))
        print("已成功修改 project.pbxproj，跳过 Codesign sparkle 和 Carthage Bootstrap 脚本。")
        EOF

        # 验证修改是否生效
        if grep -q 'runOnlyForDeploymentPostprocessing = 1' PlayCover.xcodeproj/project.pbxproj; then
          echo "✅ 确认脚本已设置为仅在部署时运行。"
        else
          echo "⚠️ 警告：未检测到修改，但继续编译。"
        fi

    - name: 编译 PlayCover (无签名)
      run: |
        xcodebuild -project PlayCover.xcodeproj \
                   -scheme PlayCover \
                   -configuration Release \
                   -derivedDataPath ./DerivedData \
                   clean build \
                   CODE_SIGN_IDENTITY="-" \
                   CODE_SIGNING_REQUIRED=YES \
                   CODE_SIGNING_ALLOWED=YES

    - name: 打包为 DMG
      run: |
        APP_PATH="DerivedData/Build/Products/Release/PlayCover.app"
        mkdir -p dist
        cp -R "$APP_PATH" dist/
        hdiutil create -volname "PlayCover" -srcfolder dist -ov -format UDZO "PlayCover-unsigned.dmg"

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: PlayCover-unsigned
        path: PlayCover-unsigned.dmg
