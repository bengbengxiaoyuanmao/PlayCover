name: Build PlayCover (Unsigned)

on:
  push:
    branches: [ "main", "develop", "MaaTools" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Xcode
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: 安装 Carthage 依赖
      run: |
        brew install carthage
        rm -rf ~/Library/Caches/org.carthage.CarthageKit
        carthage bootstrap --no-use-binaries --platform macOS

    - name: 修复项目配置（移除签名脚本）
      run: |
        # 直接修改 project.pbxproj 文件，将 Codesign sparkle 脚本的调用替换为空操作
        # 查找包含 "AAC28F222899A05B005057FB" 和 "shellScript" 的行，并将其内容替换为简单的退出指令
        sed -i '' '/AAC28F222899A05B005057FB.*shellScript/,/\\\"/ s|shellScript = \".*\"|shellScript = \"exit 0\"|' PlayCover.xcodeproj/project.pbxproj
        echo "Patched project.pbxproj to disable Codesign sparkle script."
        
        # 同样处理可能遗留的 Carthage Bootstrap 脚本 (AAE8809C287ACA4900FBB23C)
        sed -i '' '/AAE8809C287ACA4900FBB23C.*shellScript/,/\\\"/ s|shellScript = \".*\"|shellScript = \"exit 0\"|' PlayCover.xcodeproj/project.pbxproj
        echo "Neutered Carthage Bootstrap script in project file."

    - name: 编译 PlayCover (无签名)
      run: |
        xcodebuild -project PlayCover.xcodeproj \
                   -scheme PlayCover \
                   -configuration Release \
                   -derivedDataPath ./DerivedData \
                   clean build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO

    - name: 打包为 DMG
      run: |
        APP_PATH="DerivedData/Build/Products/Release/PlayCover.app"
        mkdir -p dist
        cp -R "$APP_PATH" dist/
        hdiutil create -volname "PlayCover" -srcfolder dist -ov -format UDZO "PlayCover-unsigned.dmg"

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: PlayCover-unsigned
        path: PlayCover-unsigned.dmg
