name: Build PlayCover (Unsigned)

on:
  push:
    branches: [ "main", "develop", "MaaTools" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 下载官方 Release 中的 PlayTools.framework
      run: |
        mkdir -p Frameworks
        
        # 定义下载地址：优先使用最新 Release 的 dmg，如果失败则用备用 Nightly 链接
        DOWNLOAD_URL="https://github.com/PlayCover/PlayCover/releases/latest/download/PlayCover.dmg"
        BACKUP_URL="https://nightly.link/PlayCover/PlayCover/workflows/2.nightly_release/develop"
        
        echo "正在下载 PlayCover 官方 dmg..."
        # 使用 curl 下载，设置超时，允许重定向
        if ! curl -fSL -o PlayCover.dmg --connect-timeout 60 "$DOWNLOAD_URL"; then
          echo "Release 下载失败，尝试备用 Nightly 链接..."
          curl -fSL -o PlayCover.dmg "$BACKUP_URL"
        fi
        
        # 挂载 dmg
        hdiutil attach PlayCover.dmg -mountpoint /Volumes/PlayCover -nobrowse
        
        # 检查 PlayTools.framework 是否存在
        if [ -d "/Volumes/PlayCover/PlayCover.app/Contents/Frameworks/PlayTools.framework" ]; then
          cp -R "/Volumes/PlayCover/PlayCover.app/Contents/Frameworks/PlayTools.framework" ./Frameworks/
          echo "✅ PlayTools.framework 提取成功。"
        else
          echo "❌ 错误：dmg 中未找到 PlayTools.framework，请检查下载。"
          ls -R /Volumes/PlayCover/PlayCover.app/Contents/Frameworks/
          exit 1
        fi
        
        # 卸载 dmg
        hdiutil detach /Volumes/PlayCover

    - name: 注释 Cartfile 中的 PlayTools（避免重复编译）
      run: |
        sed -i '' 's/^github.*PlayTools.*/# &/' Cartfile
        echo "Cartfile 中的 PlayTools 已注释。"

    - name: 安装 Carthage 依赖（已不含 PlayTools）
      run: |
        brew install carthage
        carthage bootstrap --no-use-binaries --platform macOS

    - name: 编译 PlayCover (Ad-hoc 签名)
      run: |
        xcodebuild -project PlayCover.xcodeproj \
                   -scheme PlayCover \
                   -configuration Release \
                   -derivedDataPath ./DerivedData \
                   clean build \
                   CODE_SIGN_IDENTITY="-" \
                   CODE_SIGNING_REQUIRED=YES \
                   CODE_SIGNING_ALLOWED=YES \
                   FRAMEWORK_SEARCH_PATHS="$(pwd)/Frameworks"

    - name: 打包为 DMG
      run: |
        APP_PATH="DerivedData/Build/Products/Release/PlayCover.app"
        mkdir -p dist
        cp -R "$APP_PATH" dist/
        hdiutil create -volname "PlayCover" -srcfolder dist -ov -format UDZO "PlayCover-unsigned.dmg"

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: PlayCover-unsigned
        path: PlayCover-unsigned.dmg
