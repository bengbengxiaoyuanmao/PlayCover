name: Build PlayCover (Unsigned)

on:
  push:
    branches: [ "main", "develop", "MaaTools" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Xcode
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: 安装 Carthage 依赖
      run: |
        brew install carthage
        rm -rf ~/Library/Caches/org.carthage.CarthageKit
        carthage bootstrap --no-use-binaries --platform macOS

    - name: 编译 PlayCover (无签名)
      run: |
        # 在Xcode开始构建前，先找到那个会生成的临时脚本
        # 然后提前创建一个同名、无害的脚本，让Xcode去执行它
        SCRIPT_DIR="DerivedData/Build/Intermediates.noindex/PlayCover.build/Release/PlayCover.build"
        mkdir -p "$SCRIPT_DIR"
        
        # 创建一个无害的脚本来替代那个会报错的签名脚本
        echo "#!/bin/sh" > "$SCRIPT_DIR/Script-AAC28F222899A05B005057FB.sh"
        echo "echo '成功绕过签名。'" >> "$SCRIPT_DIR/Script-AAC28F222899A05B005057FB.sh"
        echo "exit 0" >> "$SCRIPT_DIR/Script-AAC28F222899A05B005057FB.sh"
        chmod +x "$SCRIPT_DIR/Script-AAC28F222899A05B005057FB.sh"
        echo "已成功放置无害脚本。"

        # 开始编译
        xcodebuild -project PlayCover.xcodeproj \
                   -scheme PlayCover \
                   -configuration Release \
                   -derivedDataPath ./DerivedData \
                   clean build \
                   CODE_SIGN_IDENTITY="-" \
                   CODE_SIGNING_REQUIRED=YES \
                   CODE_SIGNING_ALLOWED=YES

    - name: 打包为 DMG
      run: |
        APP_PATH="DerivedData/Build/Products/Release/PlayCover.app"
        mkdir -p dist
        cp -R "$APP_PATH" dist/
        hdiutil create -volname "PlayCover" -srcfolder dist -ov -format UDZO "PlayCover-unsigned.dmg"

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: PlayCover-unsigned
        path: PlayCover-unsigned.dmg
