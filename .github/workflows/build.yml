name: Build PlayCover (Unsigned)

on:
  push:
    branches: [ "main", "develop", "MaaTools" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Xcode
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: 安装 Carthage 依赖
      run: |
        brew install carthage
        rm -rf ~/Library/Caches/org.carthage.CarthageKit
        carthage bootstrap --no-use-binaries --platform macOS

    - name: 修复项目配置 (移除签名脚本)
      run: |
        # 1. 在项目配置中，将 Sparkle 的特定签名身份重写为通用的 Ad-hoc 身份
        sed -i '' 's/EXPANDED_CODE_SIGN_IDENTITY_NAME/CODESIGN_ALLOCATE/g' PlayCover.xcodeproj/project.pbxproj
        echo "项目文件中的签名变量已替换。"
        
        # 2. 查找可能引用旧脚本ID的所有位置并禁用
        # 这一步会注释掉所有触发 "Codesign sparkle" 阶段的配置行
        sed -i '' '/AAC28F222899A05B005057FB/,/name = "Codesign sparkle"/ s/^/\/\/ /' PlayCover.xcodeproj/project.pbxproj
        echo "已注释掉 'Codesign sparkle' 阶段。"
        
        # 3. 把 Carthage Bootstrap 脚本也一起注释掉
        sed -i '' '/AAE8809C287ACA4900FBB23C/,/name = "Carthage Bootstrap"/ s/^/\/\/ /' PlayCover.xcodeproj/project.pbxproj
        echo "已注释掉 'Carthage Bootstrap' 阶段。"

    - name: 编译 PlayCover (Ad-hoc 签名)
      run: |
        xcodebuild -project PlayCover.xcodeproj \
                   -scheme PlayCover \
                   -configuration Release \
                   -derivedDataPath ./DerivedData \
                   clean build \
                   CODE_SIGN_IDENTITY="-" \
                   CODE_SIGNING_REQUIRED=YES \
                   CODE_SIGNING_ALLOWED=YES

    - name: 打包为 DMG
      run: |
        APP_PATH="DerivedData/Build/Products/Release/PlayCover.app"
        mkdir -p dist
        cp -R "$APP_PATH" dist/
        hdiutil create -volname "PlayCover" -srcfolder dist -ov -format UDZO "PlayCover-unsigned.dmg"

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: PlayCover-unsigned
        path: PlayCover-unsigned.dmg
