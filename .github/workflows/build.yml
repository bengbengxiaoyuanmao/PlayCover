name: Build PlayCover (Unsigned)

on:
  push:
    branches: [ "main", "develop", "MaaTools" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 下载官方 Nightly 中的 PlayTools.framework
      run: |
        # 创建 Frameworks 目录
        mkdir -p Frameworks
        
        # 从官方 nightly 下载最新的 dmg
        echo "正在下载 PlayCover 官方 Nightly 版本..."
        curl -L -o PlayCover.dmg "https://nightly.link/PlayCover/PlayCover/workflows/2.nightly_release/develop"
        
        # 挂载 dmg
        hdiutil attach PlayCover.dmg -mountpoint /Volumes/PlayCover
        
        # 复制 PlayTools.framework 到项目目录
        cp -R "/Volumes/PlayCover/PlayCover.app/Contents/Frameworks/PlayTools.framework" ./Frameworks/
        
        # 卸载 dmg
        hdiutil detach /Volumes/PlayCover
        
        echo "PlayTools.framework 已就绪。"

    - name: 注释 Cartfile 中的 PlayTools（避免重复编译）
      run: |
        # 将 PlayTools 那一行注释掉
        sed -i '' 's/^github.*PlayTools.*/# &/' Cartfile
        echo "Cartfile 中的 PlayTools 已注释。"

    - name: 安装 Carthage 依赖（已不含 PlayTools）
      run: |
        brew install carthage
        carthage bootstrap --no-use-binaries --platform macOS

    - name: 编译 PlayCover (Ad-hoc 签名)
      run: |
        xcodebuild -project PlayCover.xcodeproj \
                   -scheme PlayCover \
                   -configuration Release \
                   -derivedDataPath ./DerivedData \
                   clean build \
                   CODE_SIGN_IDENTITY="-" \
                   CODE_SIGNING_REQUIRED=YES \
                   CODE_SIGNING_ALLOWED=YES \
                   FRAMEWORK_SEARCH_PATHS="$(pwd)/Frameworks"

    - name: 打包为 DMG
      run: |
        APP_PATH="DerivedData/Build/Products/Release/PlayCover.app"
        mkdir -p dist
        cp -R "$APP_PATH" dist/
        hdiutil create -volname "PlayCover" -srcfolder dist -ov -format UDZO "PlayCover-unsigned.dmg"

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: PlayCover-unsigned
        path: PlayCover-unsigned.dmg
