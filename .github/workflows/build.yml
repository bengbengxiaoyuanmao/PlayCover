name: Build PlayCover (Unsigned)

on:
  push:
    branches: [ "main", "develop", "MaaTools" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Xcode
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: 安装 Carthage 依赖
      run: |
        brew install carthage
        rm -rf ~/Library/Caches/org.carthage.CarthageKit
        carthage bootstrap --no-use-binaries --platform macOS

    - name: 编译 PlayCover (无签名)
      run: |
        # 在编译前，先修补 2 个编译脚本，移除强制签名逻辑
        find . -name "Script-AAC28F222899A05B005057FB.sh" -exec sed -i '' 's/EXPANDED_CODE_SIGN_IDENTITY_NAME/CODESIGN_ALLOCATE/' {} \;
        echo "Patched codesign sparkle script."
        
        # 找到 Carthage Bootstrap 脚本，清空其内容以避免任何意外调用
        find . -name "Script-AAE8809C287ACA4900FBB23C.sh" -exec sh -c 'echo "exit 0" > "$1"' _ {} \;
        echo "Neutered Carthage Bootstrap script."

        # 开始编译
        xcodebuild -project PlayCover.xcodeproj \
                   -scheme PlayCover \
                   -configuration Release \
                   -derivedDataPath ./DerivedData \
                   clean build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   OTHER_CODE_SIGN_FLAGS="--timestamp=none"

    - name: 打包为 DMG
      run: |
        APP_PATH="DerivedData/Build/Products/Release/PlayCover.app"
        mkdir -p dist
        cp -R "$APP_PATH" dist/
        hdiutil create -volname "PlayCover" -srcfolder dist -ov -format UDZO "PlayCover-unsigned.dmg"

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: PlayCover-unsigned
        path: PlayCover-unsigned.dmg
