name: Build PlayCover (Unsigned)

on:
  push:
    branches: [ "main", "develop", "MaaTools" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Xcode
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: 安装 Carthage 依赖
      run: |
        brew install carthage
        rm -rf ~/Library/Caches/org.carthage.CarthageKit
        carthage bootstrap --no-use-binaries --platform macOS

    - name: 编译 PlayCover (无签名)
      run: |
        # 1. 在编译前，先确保构建中间目录存在
        mkdir -p DerivedData/Build/Intermediates.noindex/PlayCover.build/Release/PlayCover.build
        
        # 2. 创建一个无害的脚本，覆盖掉那个会报错的 Codesign sparkle 脚本
        cat > DerivedData/Build/Intermediates.noindex/PlayCover.build/Release/PlayCover.build/Script-AAC28F222899A05B005057FB.sh << 'EOF'
        #!/bin/sh
        echo "成功绕过签名脚本。"
        exit 0
        EOF
        chmod +x DerivedData/Build/Intermediates.noindex/PlayCover.build/Release/PlayCover.build/Script-AAC28F222899A05B005057FB.sh
        
        # 3. 同样处理 Carthage Bootstrap 脚本（防止它再次出现）
        cat > DerivedData/Build/Intermediates.noindex/PlayCover.build/Release/PlayCover.build/Script-AAE8809C287ACA4900FBB23C.sh << 'EOF'
        #!/bin/sh
        echo "成功绕过 Carthage Bootstrap 脚本。"
        exit 0
        EOF
        chmod +x DerivedData/Build/Intermediates.noindex/PlayCover.build/Release/PlayCover.build/Script-AAE8809C287ACA4900FBB23C.sh

        # 4. 开始编译
        xcodebuild -project PlayCover.xcodeproj \
                   -scheme PlayCover \
                   -configuration Release \
                   -derivedDataPath ./DerivedData \
                   clean build \
                   CODE_SIGN_IDENTITY="-" \
                   CODE_SIGNING_REQUIRED=YES \
                   CODE_SIGNING_ALLOWED=YES

    - name: 打包为 DMG
      run: |
        APP_PATH="DerivedData/Build/Products/Release/PlayCover.app"
        mkdir -p dist
        cp -R "$APP_PATH" dist/
        hdiutil create -volname "PlayCover" -srcfolder dist -ov -format UDZO "PlayCover-unsigned.dmg"

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: PlayCover-unsigned
        path: PlayCover-unsigned.dmg
